<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login Page</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0F172A,#312E81,#2563EB);
    overflow:hidden;
}

/* Background Glow */
body::before{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#7C3AED;
    top:-120px;
    left:-120px;
    border-radius:50%;
    filter:blur(120px);
}

body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#06B6D4;
    bottom:-100px;
    right:-100px;
    border-radius:50%;
    filter:blur(120px);
}

/* Login Card */
.login-box{
    position:relative;
    z-index:10;
    width:380px;
    padding:40px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(18px);
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.login-box h2{
    text-align:center;
    color:white;
    font-size:32px;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#dcdcdc;
    margin-bottom:30px;
}

/* Input */
.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box i{
    position:absolute;
    top:50%;
    left:15px;
    transform:translateY(-50%);
    color:white;
}

.input-box input{
    width:100%;
    padding:14px 15px 14px 45px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    color:white;
    font-size:15px;
    transition:.3s;
}

.input-box input::placeholder{
    color:#ddd;
}

.input-box input:focus{
    border-color:#60A5FA;
    box-shadow:0 0 10px rgba(96,165,250,.6);
}

/* Remember */
.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    color:white;
    font-size:14px;
}

.options a{
    color:#8ED6FF;
    text-decoration:none;
}

.options a:hover{
    text-decoration:underline;
}

/* Button */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#6366F1;
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4338CA;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(99,102,241,.4);
}

/* Register */
.register{
    text-align:center;
    margin-top:25px;
    color:white;
}

.register a{
    color:#8ED6FF;
    text-decoration:none;
    font-weight:600;
}

.register a:hover{
    text-decoration:underline;
}

@media(max-width:450px){
    .login-box{
        width:90%;
        padding:30px;
    }

    .options{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <h2>Welcome Back</h2>
    <p>Login to your account</p>

    <form>

        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password" required>
        </div>

        <div class="options">
            <label>
                <input type="checkbox"> Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>

        <div class="register">
            Don't have an account?
            <a href="#">Register</a>
        </div>

    </form>

</div>

</body>
</html>
