<!DOCTYPE html>
<html>
<head>
    <title>Bimba K</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .login{
            background:white;
            padding:25px;
            width:300px;
            border-radius:8px;
            text-align:center;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
        h2{
            margin-bottom:5px;
        }
        p{
            color:gray;
            font-size:14px;
        }
        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }
        button{
            width:100%;
            padding:10px;
            background:#4a6cf7;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover{
            background:#3657d6;
        }
    </style>
</head>
<body>

<div class="login">
    <h2>Bimba K</h2>
    <p>Aspiring Data Analyst | AI & Open Source Enthusiast</p>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button>Login</button>
</div>

</body>
</html>
